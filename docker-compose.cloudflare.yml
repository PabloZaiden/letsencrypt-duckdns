services:
  letsencrypt:
    build: .
    volumes:
      - ./certs-cloudflare:/etc/letsencrypt
    environment:
      DNS_PROVIDER: cloudflare
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?Set a zone-scoped Cloudflare API token}
      LETSENCRYPT_DOMAIN: ${LETSENCRYPT_DOMAIN:?Set your cluster domain}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?Set your ACME account email}
      LETSENCRYPT_WILDCARD: 'true'
      TESTING: 'true'
    restart: unless-stopped
